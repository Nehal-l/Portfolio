<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion Graphics | Nehal</title>
  <link rel="stylesheet" href="Motion.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<section class="gallery-header">
  <div class="header-content">


    <div class="header-text">
      <h1>Motion Graphics</h1>
      <p>Animation • Reels • Motion Design • Transitions</p>
    </div>

  </div>
</section>

<!-- GALLERY -->
<section class="gallery-container">
  <div class="gallery-grid">

    <!-- VIDEO ITEM -->
    <div class="gallery-item">
      <video muted loop>
        <source src="../assets/videos/Frachise.mp4" type="video/mp4">
      </video>
    </div>

    <div class="gallery-item">
      <video muted loop>
        <source src="../assets/videos/Franchising.mp4" type="video/mp4">
      </video>
    </div>

    <div class="gallery-item">
      <video muted loop>
        <source src="../assets/motion/video3.mp4" type="video/mp4">
      </video>
    </div>

  </div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <div id="lightbox-content"></div>
</div>

<script src="Motion.js"></script>

</body>
</html>
